<!-- public/index.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monitoreo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .cards {
            display: flex;
            gap: 1rem;
        }

        .card {
            flex: 1;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
        }

        .card b {
            font-size: 2rem;
            display: block;
        }

        .alerta {
            background: #fdd;
            border-color: #c00;
        }
    </style>
</head>

<body>
    <h1>Temperatura y humedad</h1>
    <div class="cards">
        <div class="card" id="cT">Temp<b>--</b></div>
        <div class="card" id="cH">Humedad<b>--</b></div>
    </div>
    <canvas id="grafica"></canvas>

    <script>
        const chart = new Chart(document.getElementById('grafica'), {
            type: 'line',
            data: {
                labels: [], datasets: [
                    { label: 'Temp (°C)', data: [], borderColor: '#d33' },
                    { label: 'Humedad (%)', data: [], borderColor: '#36c' },
                ]
            },
        });

        async function actualizar() {
            try {
                const r = await fetch('/api/lecturas?limit=30');
                const d = await r.json();
                if (!d.length) return;
                chart.data.labels = d.map(x => new Date(x.createdAt).toLocaleTimeString());
                chart.data.datasets[0].data = d.map(x => x.temperatura);
                chart.data.datasets[1].data = d.map(x => x.humedad);
                chart.update();

                const u = d[d.length - 1];
                cT.innerHTML = `Temp<b>${u.temperatura.toFixed(1)} °C</b>`;
                cH.innerHTML = `Humedad<b>${u.humedad.toFixed(1)} %</b>`;
                cT.classList.toggle('alerta', u.alerta);
                cH.classList.toggle('alerta', u.alerta);
            } catch (e) { console.error(e); }
        }
        actualizar();
        setInterval(actualizar, 3000);
    </script>
</body>

</html>
